services:
  mongo:
    image: mongo:7
    restart: on-failure
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/jashoreFoodiesDB
      DB_NAME: jashoreFoodiesDB
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-access-token-secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-token-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jashorefoodies.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      STORE_ID: ${STORE_ID:-}
      STORE_PASS: ${STORE_PASS:-}
      SSL_IS_LIVE: ${SSL_IS_LIVE:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: on-failure
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  mongo_data:
