# Shared env for the API and the one-shot seed job.
x-backend-env: &backend-env
  NODE_ENV: development
  MONGODB_URI: mongodb://mongo:27017/jashoreFoodiesDB
  DB_NAME: jashoreFoodiesDB
  CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
  API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-access-token-secret}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-token-secret}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jashorefoodies.test}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-jashore-foodies}
  S3_FORCE_PATH_STYLE: "true"
  STORE_ID: ${STORE_ID:-}
  STORE_PASS: ${STORE_PASS:-}
  SSL_IS_LIVE: ${SSL_IS_LIVE:-false}

services:
  mongo:
    image: mongo:7
    restart: on-failure
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and make its objects publicly readable.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-jashore-foodies}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set download "local/$${S3_BUCKET}"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  # One-shot: load demo restaurants, menus, tables and images (idempotent).
  # Runs on every `up`; fast after the first run since images are cached in
  # MinIO. Skip it with `docker compose up mongo minio createbuckets backend frontend`.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
    command: ["pnpm", "seed"]
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: on-failure
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  mongo_data:
  minio_data:
